apis:
- name: Metamarkets Real-Time Data Ingestion (RDI) API
  description: >-
    HTTPS event-stream ingestion API for programmatic advertising data.
    Customers continuously POST newline-delimited, OpenRTB-based JSON event
    records (gzip-compressed) to a per-customer HTTPS endpoint using HTTP Basic
    authentication; RDI processes the stream and surfaces it in the Metamarkets
    dashboard within seconds. Single-event posting is not supported (batched
    delivery only).
  humanURL: https://docs.metamarkets.com/docs/getting-started
  baseURL: https://rt-evaluate.metamarkets.com
