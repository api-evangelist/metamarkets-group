aid: metamarkets-group
name: Metamarkets Group
description: >-
  Metamarkets was a real-time analytics platform for programmatic advertising,
  giving ad exchanges, SSPs, DSPs, and ad networks interactive dashboards over
  billions of daily bid, impression, click, and spend events. Its Real-time Data
  Ingestion (RDI) API accepted continuous streams of OpenRTB-based JSON event
  records over authenticated HTTPS POST, surfacing them in the Metamarkets
  dashboard within seconds. Founded in 2010 and the birthplace of the Druid
  analytics database (now Apache Druid), Metamarkets was acquired by Snap Inc. in
  2017; its successor products live on as Rill Data. This profile enriches the
  dcvc portfolio lead from the surviving public documentation at
  docs.metamarkets.com.
